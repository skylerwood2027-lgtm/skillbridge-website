# Every morning: read the Reels' view counts from Instagram and, when the
# homepage numbers changed, commit reels.json (and any new top-five
# thumbnail). Vercel deploys the commit. Needs the IG_TOKEN and IG_USER_ID
# repo secrets, which scripts/connect-instagram.mjs sets.
name: Update Reels

on:
  schedule:
    - cron: '0 15 * * *' # 7 AM Pacific (8 AM during daylight time)
  workflow_dispatch:

permissions:
  contents: write

concurrency: update-reels

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Read Instagram and update reels.json
        run: |
          if [ -z "$IG_TOKEN" ]; then echo "Instagram isn't connected yet (run scripts/connect-instagram.mjs)."; exit 0; fi
          node scripts/update-reels.mjs
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
      - name: Build and commit if anything changed
        run: |
          if [ -z "$(git status --porcelain -- src/data/reels.json public/reels)" ]; then
            echo "Nothing changed."
            exit 0
          fi
          npm run build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/reels.json public/reels
          git commit -m "content(home): daily Reel views"
          git pull --rebase
          git push
